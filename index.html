<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FoodChecker</title>
    <meta name="description" content="Snap a photo of your food and get calories and macros." />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FoodChecker" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <main class="app">
      <div id="view-today" class="view"></div>
      <div id="view-stats" class="view" hidden></div>
      <div id="view-settings" class="view" hidden></div>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h2v8a2 2 0 0 1-1 1.7V21H4v-8.3A2 2 0 0 1 3 11V3h2v6h0V3Zm-1 0v6h1V3H4Zm2 0v6h1V3H6Zm10 0c2.2 0 4 2.7 4 6 0 2.4-1 4.5-2.4 5.4L18 21h-2.5l.3-6.6C14.5 13.5 13 11.4 13 9c0-3.3 1.3-6 3-6Z"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg>
        <span>Progress</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.6ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <input id="photo-input" type="file" accept="image/*" hidden />

    <dialog id="review" class="sheet">
      <div class="sheet-body" id="review-body"></div>
    </dialog>
    <dialog id="scanner" class="sheet">
      <div class="sheet-body" id="scanner-body"></div>
    </dialog>
    <dialog id="mini" class="sheet">
      <div class="sheet-body" id="mini-body"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

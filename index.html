<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FoodChecker</title>
    <meta name="description" content="Snap a photo of your food and get calories and macros." />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FoodChecker" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Start-up splash: inline so it shows before the app's code has loaded. */
      #splash { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: #2f8f5b; color: #fff; font: 600 16px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; transition: opacity .5s ease, transform .5s ease; }
      #splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
      .sp-logo { animation: sp-pop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
      .sp-ring { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 252; stroke-dashoffset: 252; transform: rotate(-90deg); transform-origin: 60px 64px; animation: sp-draw .9s .15s ease-out forwards; }
      .sp-plate { fill: #e2f1e8; transform-origin: 60px 64px; animation: sp-pop .5s .35s cubic-bezier(.2, 1.4, .4, 1) both; }
      .sp-check { fill: none; stroke: #2f8f5b; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: sp-draw .45s .7s ease-out forwards; }
      .sp-leaf { fill: #bfe6cd; transform-origin: 60px 22px; animation: sp-leaf .6s .9s cubic-bezier(.2, 1.4, .4, 1) both; }
      .sp-name { font-size: 30px; font-weight: 800; letter-spacing: -.5px; animation: sp-up .5s .5s ease-out both; }
      .sp-tag { font-size: 15px; opacity: .85; min-height: 20px; animation: sp-up .5s .7s ease-out both; }
      .sp-dots { display: flex; gap: 6px; margin-top: 18px; }
      .sp-dots i { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .5; animation: sp-bounce 1s infinite ease-in-out; }
      .sp-dots i:nth-child(2) { animation-delay: .15s; } .sp-dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes sp-pop { from { transform: scale(.4); opacity: 0; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-leaf { from { transform: scale(0) rotate(-40deg); } }
      @keyframes sp-up { from { transform: translateY(12px); opacity: 0; } }
      @keyframes sp-bounce { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-6px); opacity: 1; } }
      @media (prefers-color-scheme: dark) { #splash { background: #15171a; } .sp-check { stroke: #15171a; } .sp-ring { stroke: #4cbf80; } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; } .sp-ring, .sp-check { stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-logo">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle class="sp-ring" cx="60" cy="64" r="40" />
          <circle class="sp-plate" cx="60" cy="64" r="27" />
          <path class="sp-check" d="M47 65l9 9 18-19" />
          <path class="sp-leaf" d="M60 22c0-10 8-15 17-15-1 10-7 15-17 15z" />
        </svg>
      </div>
      <div class="sp-name">FoodChecker</div>
      <div class="sp-tag" id="splash-tag"></div>
      <div class="sp-dots"><i></i><i></i><i></i></div>
    </div>
    <main class="app">
      <div id="view-today" class="view"></div>
      <div id="view-chat" class="view" hidden></div>
      <div id="view-stats" class="view" hidden></div>
      <div id="view-more" class="view" hidden></div>
      <div id="view-settings" class="view" hidden></div>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h2v8a2 2 0 0 1-1 1.7V21H4v-8.3A2 2 0 0 1 3 11V3h2v6h0V3Zm-1 0v6h1V3H4Zm2 0v6h1V3H6Zm10 0c2.2 0 4 2.7 4 6 0 2.4-1 4.5-2.4 5.4L18 21h-2.5l.3-6.6C14.5 13.5 13 11.4 13 9c0-3.3 1.3-6 3-6Z"/></svg>
        <span data-i18n="today">Today</span>
      </button>
      <button class="tab" data-tab="chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.9 2 11.7c0 2.5 1.2 4.7 3.2 6.3L4.5 21.5l3.9-2c1.1.4 2.3.6 3.6.6 5.5 0 10-3.9 10-8.7S17.5 3 12 3Zm-4 9.9a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
        <span data-i18n="chat">Chat</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg>
        <span data-i18n="progress">Progress</span>
      </button>
      <button class="tab" data-tab="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm10 0h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1ZM5 14h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1Zm12-.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z"/></svg>
        <span data-i18n="more">More</span>
      </button>
    </nav>

    <input id="photo-input" type="file" accept="image/*" hidden />

    <dialog id="review" class="sheet">
      <div class="sheet-body" id="review-body"></div>
    </dialog>
    <dialog id="scanner" class="sheet">
      <div class="sheet-body" id="scanner-body"></div>
    </dialog>
    <dialog id="mini" class="sheet">
      <div class="sheet-body" id="mini-body"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
